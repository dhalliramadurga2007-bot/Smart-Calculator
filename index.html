<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcPro - Smart Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo">
                    <i class="fa-solid fa-calculator"></i>
                </div>

                <div>
                    <h1>CalcPro</h1>
                    <p>Smart Calculator</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="themeBtn" class="icon-btn" title="Change Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <button id="historyBtn" class="icon-btn" title="History">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </div>
        </header>


        <!-- Calculator -->
        <main class="calculator">

            <!-- Display -->
            <section class="display">

                <div class="display-top">
                    <span id="expression">Ready</span>

                    <button id="copyBtn" class="copy-btn" title="Copy Result">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <div id="previousDisplay" class="previous-display"></div>

                <div id="currentDisplay" class="current-display">
                    0
                </div>

            </section>


            <!-- Scientific Toggle -->
            <div class="mode-row">
                <span>
                    <i class="fa-solid fa-flask"></i>
                    Scientific Mode
                </span>

                <label class="switch">
                    <input type="checkbox" id="scientificToggle">
                    <span class="slider"></span>
                </label>
            </div>


            <!-- Scientific Buttons -->
            <div id="scientificPanel" class="scientific-panel">

                <button data-action="sqrt">√</button>
                <button data-action="square">x²</button>
                <button data-action="reciprocal">1/x</button>
                <button data-action="sign">±</button>

                <button data-action="sin">sin</button>
                <button data-action="cos">cos</button>
                <button data-action="tan">tan</button>
                <button data-action="log">log</button>

            </div>


            <!-- Main Buttons -->
            <section class="buttons">

                <button class="btn clear" data-action="clear">
                    AC
                </button>

                <button class="btn delete" data-action="delete">
                    <i class="fa-solid fa-delete-left"></i>
                </button>

                <button class="btn operator" data-operation="%">
                    %
                </button>

                <button class="btn operator" data-operation="/">
                    ÷
                </button>


                <button class="btn number" data-number="7">7</button>
                <button class="btn number" data-number="8">8</button>
                <button class="btn number" data-number="9">9</button>

                <button class="btn operator" data-operation="*">
                    ×
                </button>


                <button class="btn number" data-number="4">4</button>
                <button class="btn number" data-number="5">5</button>
                <button class="btn number" data-number="6">6</button>

                <button class="btn operator" data-operation="-">
                    −
                </button>


                <button class="btn number" data-number="1">1</button>
                <button class="btn number" data-number="2">2</button>
                <button class="btn number" data-number="3">3</button>

                <button class="btn operator" data-operation="+">
                    +
                </button>


                <button class="btn number zero" data-number="0">
                    0
                </button>

                <button class="btn number" data-number=".">
                    .
                </button>

                <button class="btn equals" data-action="calculate">
                    =
                </button>

            </section>

        </main>


        <!-- History Panel -->
        <aside id="historyPanel" class="history-panel">

            <div class="history-header">
                <div>
                    <h2>Calculation History</h2>
                    <p>Your recent calculations</p>
                </div>

                <button id="closeHistory" class="close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="historyList" class="history-list">
                <p class="empty-history">
                    No calculations yet.
                </p>
            </div>

            <button id="clearHistory" class="clear-history">
                <i class="fa-solid fa-trash"></i>
                Clear History
            </button>

        </aside>

        <div id="toast" class="toast">
            Result copied!
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
